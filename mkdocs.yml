site_name: Madhusudansingh Rathore Portfolio
site_description: Portfolio of Madhusudansingh Rathore
site_url: https://themadhu.dev
theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Sora
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
plugins:
  - search
  # - blog
  - meta
  - social

nav:
  - Home: index.md
  - System Design:
    - Overview: System Design/intro.md
    - Message Queues: System Design/message-queues.md
  - API Fundamentals:
    - Overview: API Fundamentals/intro.md
    - Protocols:
      - REST: API Fundamentals/rest.md
      - HTTP: API Fundamentals/http.md
      - Status Codes: API Fundamentals/status-codes.md
      - GraphQL: API Fundamentals/graphql.md
    - RPC :
      - RPC (gRPC, tRPC): API Fundamentals/rpc.md
      - IPC: API Fundamentals/ipc.md
    - RTC :
      - WebSockets: API Fundamentals/websockets.md
      - Server-Sent Events: API Fundamentals/sse.md
    - Design Patterns & Cheat Sheet: API Fundamentals/lc-lg-ls.md
  - Generative AI:
    - Overview: Generative AI/intro.md
    - Fundamentals:
      - LLM Fundamentals: Generative AI/llm-fundamentals.md
      - Prompt Engineering: Generative AI/prompt-engineering.md
    - RAG:
      - Overview: Generative AI/rag.md
    - LangChain, LangGraph, LangSmith:
      - LangChain: Generative AI/langchain.md
      - LangGraph: Generative AI/langgraph.md
      - LangSmith: Generative AI/langsmith.md
  - Learnings:
    - Database:
      - Overview: Database/intro.md
      - Sequence: Database/sequence.md
      - Bigint vs Uuidv7 Id Strategy: Project Learnings/bigint-vs-uuidv7-id-strategy.md
      - Senior Engineer Database Answers: Database/senior_engineer_database_answers.md
    - Prisma & Kysely:
      - Overview: Prisma & Kysely/intro.md
      - Prisma & Kysely: Project Learnings/prisma-kysely.md
      - Shadow DB FK Dependency Error: Project Learnings/prisma-shadow-db-fk-dependency-error.md
      - Prisma & Kysely Integration Issue: Project Learnings/prisma-kysely-integration-issue.md
      - Persist Hydration SSR Error: Project Learnings/persist-hydration-ssr-error.md
      - Prisma BigSerial Alter Column: Project Learnings/prisma-bigserial-alter-column.md
    - Authentication-Authorization:
      - Authentication & Authorization: Authentication-Authorization/auth.md
      - JWTs Are Overrated: Authentication-Authorization/jwt-overrated.md
      - Authentication is a Developer Nightmare: Authentication-Authorization/auth-nightmare.md
      - Auth Token Compilation: Authentication-Authorization/compilation.md
      - Authentication Methods Explained: Authentication-Authorization/real-world.md
      - Pragmatic Approach to Authentication: Authentication-Authorization/real-world-2.md
  - Miscellaneous:
    - Quick Reference: Miscellaneous/misc.md
    - Fastify VPS Scaling Guide: Miscellaneous/fastify_vps_scaling_guide.md
  - VPS Must Know:
    - Overview: VPS Must Know/intro.md
    - UFW: VPS Must Know/ufw.md
  - Nginx:
    - Intro: nginx/intro.md
    - Setup: nginx/setup.md
    - Rate Limiting: nginx/rate-limiting.md
    - Logging: nginx/logging.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # mermaid itself is not listed here — mermaid-init.js fetches it on demand,
  # only on pages that actually contain a diagram. See that file.
  - javascripts/mermaid-init.js
