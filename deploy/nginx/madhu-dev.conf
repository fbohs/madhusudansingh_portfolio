# themadhu.dev — static MkDocs site.
#
# Mirrors /etc/nginx/sites-available/madhu-dev on vps-79tech-deploy.
# Written for nginx 1.24.0 (Ubuntu 24.04) — note `listen 443 ssl http2;`, the
# pre-1.25 form. Do NOT use the newer `http2 on;` directive here; 1.24 rejects it.
#
# Apply (deployment_user owns this file, so no sudo for the copy):
#   scp deploy/nginx/madhu-dev.conf vps-79tech-deploy:/tmp/madhu-dev.conf
#   ssh vps-79tech-deploy
#   cp /etc/nginx/sites-available/madhu-dev ~/madhu-dev.bak      # keep a rollback
#   cp /tmp/madhu-dev.conf /etc/nginx/sites-available/madhu-dev
#   sudo nginx -t && sudo systemctl reload nginx                 # needs your password
#
# Rollback: cp ~/madhu-dev.bak /etc/nginx/sites-available/madhu-dev && sudo systemctl reload nginx
#
# Certbot note: the previous file carried "# managed by Certbot" markers, meaning
# it was last touched by the nginx installer plugin. Certs are unchanged here, so
# `certbot renew` keeps working. If you ever re-run `certbot --nginx` it may
# rewrite these blocks again.

# ─── HTTP: redirect everything to HTTPS ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name themadhu.dev www.themadhu.dev;

    # Must stay on plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://themadhu.dev$request_uri;
    }
}

# ─── HTTPS: www -> apex ───────────────────────────────────────────────────────
# Previously www and the apex served identical content from the same root, which
# is duplicate content against a site_url of https://themadhu.dev. Redirect instead.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.themadhu.dev;

    ssl_certificate     /etc/letsencrypt/live/themadhu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themadhu.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/themadhu.dev/chain.pem;

    return 301 https://themadhu.dev$request_uri;
}

# ─── HTTPS: the site ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name themadhu.dev;

    # Flat build output — publish.sh rsyncs the contents of site/ to here.
    root /var/www/madhusudansingh_rathore_portfolio;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/themadhu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themadhu.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/themadhu.dev/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── Security headers ───────────────────────────────────────────────────────
    #
    # WARNING: nginx's add_header does not merge with inherited directives. A
    # single add_header in any location block below would DISCARD every header
    # declared here for responses handled by that block. The caching blocks use
    # `expires` only, precisely so this set survives. Don't add add_header there.
    #
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The old policy was `default-src 'self' http: https: data: blob: 'unsafe-inline'`,
    # which allows script from any origin on the web — it parsed as a CSP but
    # blocked nothing. This is scoped to what the site actually loads:
    #   unpkg.com        mermaid, fetched on demand by javascripts/mermaid-init.js
    #   fonts.googleapis Material's stylesheet for Sora / JetBrains Mono
    #   fonts.gstatic    the font files
    # 'unsafe-inline' is unavoidable: Material inlines bootstrap JS and mermaid
    # injects a <style> block per diagram.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # X-XSS-Protection is deliberately absent. It is deprecated, ignored by
    # current browsers, and its legacy auditor could itself introduce holes.

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # ─── Routing ────────────────────────────────────────────────────────────────
    #
    # The previous config read:
    #     index index.html          <- missing semicolon
    #     try_files $uri $uri/ /index.html;
    # nginx parsed that as ONE index directive with five arguments, so try_files
    # never ran at all. It still worked by accident, because directory URLs
    # resolve through `index` anyway.
    #
    # `=404` is deliberate. The old fallback of `/index.html` is SPA behaviour:
    # every broken link would return the homepage with a 200, hiding the breakage
    # from you and from search engines. A docs site wants a real 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # ─── Caching (expires only — see the add_header warning above) ───────────────

    # Material fingerprints its bundles (bundle.79ae519e.min.js).
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Ours are not fingerprinted; keep the TTL short so a token or mermaid-init
    # change is not pinned in browsers.
    location ~ ^/(stylesheets|javascripts)/ {
        expires 1h;
    }

    # Revalidate HTML so new pages appear immediately after a publish.
    # Note: directory URLs reach this block via the `index` internal redirect.
    location ~* \.html$ {
        expires -1;
    }

    location = /search/search_index.json {
        expires 1h;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/themadhu.dev.access.log;
    error_log  /var/log/nginx/themadhu.dev.error.log warn;
}
